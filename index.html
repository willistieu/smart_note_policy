<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Smart Note</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- GitHub Markdown CSS for base styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <!-- Marked.js for parsing markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
            color: #e2e8f0;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* Override markdown styles for a more premium look */
        .markdown-body {
            color-scheme: dark;
            background: transparent !important;
            font-family: inherit !important;
            --color-canvas-default: transparent;
            --color-fg-default: #e2e8f0;
            --color-border-default: rgba(255, 255, 255, 0.1);
            --color-border-muted: rgba(255, 255, 255, 0.05);
            --color-neutral-muted: rgba(255, 255, 255, 0.4);
            --color-accent-fg: #818cf8;
            --color-accent-emphasis: #6366f1;
            font-size: 17px;
            line-height: 1.7;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            border-bottom: 1px solid var(--color-border-default);
            padding-bottom: 0.3em;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .markdown-body h1 {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: none;
            font-size: 2.5em;
            margin-bottom: 1em;
            text-align: center;
        }

        .markdown-body a {
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .markdown-body a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #818cf8;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }
            .container {
                padding: 30px 25px;
                border-radius: 16px;
            }
            .markdown-body h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div id="content" class="markdown-body">
            <div id="loading">
                <div class="spinner"></div>
                Loading Privacy Policy...
            </div>
        </div>
    </div>

    <script>
        // Fetch and render the markdown file
        fetch('PRIVACY.md')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load markdown file');
                return response.text();
            })
            .then(text => {
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = marked.parse(text);
                
                // Add class to trigger entrance animation
                setTimeout(() => {
                    document.getElementById('main-container').classList.add('loaded');
                }, 50);
            })
            .catch(error => {
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">Error loading privacy policy. Please try again later.</p>';
                document.getElementById('main-container').classList.add('loaded');
                console.error('Error fetching the markdown file:', error);
            });
    </script>
</body>
</html>
